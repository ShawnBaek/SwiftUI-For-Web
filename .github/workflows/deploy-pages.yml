# Deploy SwiftUI-For-Web documentation to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Allow manual trigger
  workflow_dispatch:

# Sets permissions for GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Publish only the site (#53): the demo page, docs, examples and the
      # framework source the examples import. Not tests, scripts or config.
      - name: Stage site
        run: |
          mkdir -p _site
          cp index.html README.md AGENTS.md _site/
          cp -R docs Examples src _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
