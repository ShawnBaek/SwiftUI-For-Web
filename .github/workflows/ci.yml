# CI — zero-dependency validation on the self-hosted macOS runner.
#
# Targets the runner labeled `swiftui-for-web` (alongside the default
# `self-hosted` / `macOS` / `ARM64` labels) so this workflow can never
# accidentally land on a different self-hosted runner the maintainer owns.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to keep the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Defense in depth against the public-repo / self-hosted-runner risk:
    # fork PRs never run on this runner. The repo-level setting
    # `Settings → Actions → General → Fork pull request workflows` is the
    # primary gate; this `if` is a belt-and-braces second layer.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: [self-hosted, swiftui-for-web]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Unit tests (node run-tests.js)
        run: node run-tests.js

      - name: Tests/** suites that need no DOM
        run: node scripts/run-node-suites.js

      - name: Package entries, exports, and index.d.ts against the runtime
        run: node scripts/check-package.js

      # Runs Tests/TestRunner.html headless in the runner's installed
      # Chromium-family browser. No npm dependencies; set BROWSER_BIN on the
      # runner if the browser is not in a standard location.
      - name: Browser unit tests (Tests/TestRunner.html)
        run: node scripts/run-browser-tests.js

      - name: Production builder tests
        run: node scripts/build-tests.js

      - name: Production build
        run: node scripts/build.js

      # Fails when the gzipped dist/ total grows past the budget (#53). Raise
      # the budget deliberately, in the PR that needs it.
      - name: Bundle size budget
        run: node scripts/size.js dist --budget-gzip-kb 120
