<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Netflix Clone - SwiftUI for Web</title>
  <link rel="stylesheet" href="../../src/styles/index.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #141414;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    #root {
      width: 100%;
      min-height: 100vh;
    }

    /* Hide scrollbar for carousels */
    .swiftui-hide-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /*
     * Card hover + carousel-mask CSS used to live here but were dead —
     * the JS path drives transforms directly via mouseenter/leave handlers
     * and the carousel mask class was never applied to any element. The
     * mask in particular forces a composited layer that the browser has to
     * re-paint on every frame of a transform animation underneath, so
     * keeping it as dead-but-applied would have been a hidden tax.
     */
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
